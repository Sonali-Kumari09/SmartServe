<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Meal System — Today's Board</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/landing.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__brand"><span class="ticket-dot"></span> Smart Meal System</div>
  <div class="topbar__actions">
    <a class="btn btn--primary btn--sm" href="login.html">Log in</a>
  </div>
</header>

<main class="board">
  <span class="board__eyebrow">Mess Hall · Live Board</span>
  <h1 class="board__heading">What's on today</h1>

  <div id="holidayBanner" data-icon-path="assets/icons/holiday.svg" hidden></div>

  <div class="grid" style="gap:16px;">
    <div class="card">
      <span class="card__eyebrow" id="todayLabel">—</span>
      <div class="meal-clock">
        <div id="mealClock"></div>
        <div class="meal-clock__legend">
          <div class="meal-clock__row"><span class="meal-clock__swatch" style="background:#3F7D4F"></span>Open now</div>
          <div class="meal-clock__row"><span class="meal-clock__swatch" style="background:#E3A008"></span>Upcoming</div>
          <div class="meal-clock__row"><span class="meal-clock__swatch" style="background:#5B6D63"></span>Closed</div>
        </div>
      </div>
    </div>

    <div id="todayMenuList" class="today-menu-list"></div>

    <div class="card">
      <span class="card__eyebrow">This month</span>
      <div id="miniCalendar"></div>
    </div>
  </div>
</main>

<script src="js/data/storage.js"></script>
<script src="js/utils/dateUtils.js"></script>
<script src="js/data/holidayData.js"></script>
<script src="js/data/seedData.js"></script>
<script src="js/core/mealTimer.js"></script>
<script src="js/core/calendar.js"></script>
<script src="js/core/holiday.js"></script>
<script src="js/utils/notify.js"></script>
<script src="js/pages/landing.js"></script>
</body>
</html>
