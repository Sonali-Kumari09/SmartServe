<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Smart Meal System</title>
<link rel="stylesheet" href="css/base.css" />
<style>
  body { background: var(--ink-900); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { width: 100%; max-width: 380px; background: var(--paper-0); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow-card); }
  .role-tabs { display: flex; gap: 8px; margin-bottom: 22px; background: var(--paper-100); padding: 4px; border-radius: 8px; }
  .role-tabs button { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
  .role-tabs button.is-active { background: var(--ink-900); color: var(--paper-0); }
  .login-hint { font-family: var(--font-mono); font-size: 0.76rem; color: var(--steel-600); margin-top: 14px; text-align: center; }
  .back-link { display: block; text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--steel-600); text-decoration: none; }
</style>
</head>
<body>

<div class="login-box">
  <div class="split__logo" style="margin-bottom:18px;">
    <span class="ticket-dot"></span>
    <span class="display" style="font-size:1rem;">Smart Meal System</span>
  </div>

  <div class="role-tabs">
    <button type="button" data-role="student">Student</button>
    <button type="button" data-role="admin">Mess Admin</button>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
    </div>
    <button class="btn btn--primary" style="width:100%;" type="submit">Sign in</button>
  </form>

  <p class="login-hint" id="demoHint">Demo — student / student123</p>
  <a class="back-link" href="index.html">← Back to today's board</a>
</div>

<script src="js/data/storage.js"></script>
<script src="js/utils/dateUtils.js"></script>
<script src="js/data/holidayData.js"></script>
<script src="js/data/seedData.js"></script>
<script src="js/auth/auth.js"></script>
<script src="js/utils/notify.js"></script>
<script>
  SeedData.seedDatabase();

  let role = new URLSearchParams(location.search).get('role') === 'admin' ? 'admin' : 'student';

  function setRole(r) {
    role = r;
    document.querySelectorAll('.role-tabs button').forEach(b => b.classList.toggle('is-active', b.dataset.role === r));
    document.getElementById('demoHint').textContent = r === 'admin' ? 'Demo — admin / admin123' : 'Demo — student / student123';
  }
  document.querySelectorAll('.role-tabs button').forEach(b => b.addEventListener('click', () => setRole(b.dataset.role)));
  setRole(role);

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const result = Auth.login(username, password);
    if (!result.ok) { Notify.toast(result.error, 'error'); return; }
    if (result.session.role !== role) {
      Notify.toast(`That account is a ${result.session.role} account — switch tabs above.`, 'error');
      Auth.logout();
      return;
    }
    window.location.href = role === 'admin' ? 'admin/dashboard.html' : 'student/dashboard.html';
  });
</script>
</body>
</html>
