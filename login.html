<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account access — SmartServe</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="icon" href="assets/smartserve-mark.svg" type="image/svg+xml" />
<style>
  body { min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--ink-900); }
  .auth-shell { width:min(100%, 980px); display:grid; grid-template-columns:1fr 1.05fr; background:var(--paper-0); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-card); }
  .auth-intro { padding:clamp(28px, 6vw, 56px); background:linear-gradient(145deg, var(--ink-800), var(--ink-900)); color:var(--paper-0); display:flex; flex-direction:column; justify-content:center; gap:12px; }
  .auth-intro h1 { font-size:clamp(2rem, 4.5vw, 3.2rem); line-height:1.05; margin:8px 0; }
  .auth-intro p { color:rgba(250,247,236,.72); max-width:34ch; margin:0; }
  .auth-form { padding:clamp(24px, 4vw, 44px); }
  .auth-form h2 { font-size:1.5rem; margin:0 0 4px; }
  .auth-subtitle { color:var(--steel-600); margin:0 0 18px; font-size:.92rem; }
  .role-tabs, .auth-mode { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--paper-100); padding:4px; border-radius:var(--radius-sm); margin-bottom:16px; }
  .role-tabs button, .auth-mode button { border:0; background:transparent; border-radius:6px; padding:11px; font:600 .86rem var(--font-body); color:var(--steel-600); cursor:pointer; }
  .role-tabs button.is-active, .auth-mode button.is-active { background:var(--ink-900); color:var(--paper-0); }
  .role-tabs button[data-role="admin"].is-active { background:#2d4a38; }
  .auth-form form { display:grid; gap:4px; }
  .auth-form .btn { width:100%; margin-top:10px; }
  .auth-message { min-height:22px; margin:12px 0 0; color:var(--chilli); font-size:.85rem; }
  .auth-message.is-success { color:var(--veg); }
  .back-link { display:block; margin-top:18px; color:var(--steel-600); text-align:center; font-size:.86rem; }
  .role-hint { font-size:.8rem; color:var(--steel-600); margin:-6px 0 14px; padding:8px 12px; background:var(--paper-100); border-radius:8px; }
  @media (max-width:720px) { .auth-shell { grid-template-columns:1fr; } .auth-intro { display:none; } }
</style>
</head>
<body>
<div class="auth-shell">
  <section class="auth-intro">
    <a class="brand-lockup brand-lockup--light" href="index.html"><img src="assets/smartserve-mark.svg" alt="" /> <span>SmartServe</span></a>
    <h1>Eat well.<br />Waste less.</h1>
    <p>Separate portals for students and kitchen admins. Forecasts, safety checks, and surplus matching — all in one place.</p>
  </section>
  <section class="auth-form">
    <h2 id="authTitle">Welcome back</h2>
    <p class="auth-subtitle" id="authSubtitle">Choose your portal and sign in.</p>

    <div class="role-tabs" role="tablist" aria-label="Account type">
      <button type="button" data-role="student" class="is-active">Student</button>
      <button type="button" data-role="admin">Admin</button>
    </div>
    <p class="role-hint" id="roleHint">Student portal — view menus, mark attendance, and leave meal feedback.</p>

    <div class="auth-mode">
      <button type="button" data-mode="login" class="is-active">Sign in</button>
      <button type="button" data-mode="register">Create account</button>
    </div>

    <form id="authForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="6" autocomplete="current-password" />
      </div>
      <button class="btn btn--primary" id="submitButton" type="submit">Sign in</button>
    </form>
    <p class="auth-message" id="authMessage" role="alert"></p>
    <a class="back-link" href="index.html">← Back to SmartServe</a>
  </section>
</div>
<script src="js/api.js"></script>
<script src="js/auth/auth.js"></script>
<script>
(function () {
  let mode = 'login';
  let role = 'student';
  const form = document.getElementById('authForm');
  const message = document.getElementById('authMessage');
  const params = new URLSearchParams(window.location.search);
  if (params.get('mode') === 'register') mode = 'register';
  if (params.get('role') === 'admin') role = 'admin';

  const hints = {
    student: 'Student portal — view menus, mark attendance, and leave meal feedback.',
    admin: 'Admin portal — forecasts, inventory safety, surplus matching, and reports. Student accounts cannot sign in here.'
  };

  function refreshUI() {
    const registering = mode === 'register';
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('is-active', b.dataset.mode === mode));
    document.querySelectorAll('[data-role]').forEach(b => b.classList.toggle('is-active', b.dataset.role === role));
    document.getElementById('roleHint').textContent = hints[role];
    document.getElementById('authTitle').textContent = registering
      ? (role === 'admin' ? 'Create admin account' : 'Create student account')
      : (role === 'admin' ? 'Admin sign in' : 'Student sign in');
    document.getElementById('authSubtitle').textContent = registering
      ? `Register a new ${role} account for SmartServe.`
      : `Sign in to the ${role} workspace.`;
    document.getElementById('submitButton').textContent = registering ? 'Create account' : 'Sign in';
    message.textContent = '';
    message.className = 'auth-message';
  }

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; refreshUI(); }));
  document.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => { role = b.dataset.role; refreshUI(); }));
  refreshUI();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    message.textContent = '';
    message.className = 'auth-message';
    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let result;
      if (mode === 'register') {
        if (!email) {
          message.textContent = 'Email is required.';
          return;
        }
        if (!password || password.length < 6) {
          message.textContent = 'Password must be at least 6 characters.';
          return;
        }
        result = await API.register({ email, password, role });
      } else {
        if (!email || !password) {
          message.textContent = 'Email and password are required.';
          return;
        }
        result = await API.login(email, password, role);
      }
      if (result.user.role !== role) {
        API.clearSession();
        throw new Error(role === 'admin'
          ? 'This is not an admin account. Use the Student portal.'
          : 'This is not a student account. Use the Admin portal.');
      }
      API.saveSession(result.token, result.user);
      window.location.href = result.user.role === 'admin' ? 'admin/dashboard.html' : 'student/dashboard.html';
    } catch (error) {
      message.textContent = error.message || 'Something went wrong.';
    }
  });
})();
</script>
</body>
</html>
