<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surplus &amp; Matching — SmartServe</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="icon" href="../assets/smartserve-mark.svg" type="image/svg+xml" />
</head>
<body>

<header class="topbar">
  <a class="brand-lockup brand-lockup--light" href="../index.html"><img src="../assets/smartserve-mark.svg" alt="" /> <span>SmartServe · Admin</span></a>
  <div class="topbar__actions">
    <span class="topbar__meta">Signed in as <strong id="adminName">—</strong></span>
    <button class="btn btn--ghost btn--sm" id="logoutBtn">Sign out</button>
  </div>
</header>
<nav class="admin-nav">
  <a href="dashboard.html">Overview</a>
  <a href="inventory.html">Inventory</a>
  <a href="surplus.html" class="is-active">Surplus &amp; Matching</a>
  <a href="reports.html">Reports</a>
</nav>

<main class="page">
  <h1 style="font-size:1.3rem;">Surplus detection &amp; shelter matching</h1>
  <p style="color:var(--steel-600);margin-bottom:20px;">Verify each item is still safe, then match it to the nearest eligible shelter. Expired items are locked out of matching and donation.</p>

  <div class="card" style="margin-bottom:20px;">
    <span class="card__eyebrow">Add recipient</span>
    <form id="recipientForm" class="inv-form-grid">
      <div class="field"><label for="recipientName">Organization</label><input id="recipientName" required /></div>
      <div class="field"><label for="recipientContact">Contact person</label><input id="recipientContact" /></div>
      <div class="field"><label for="recipientCity">City</label><input id="recipientCity" /></div>
      <div class="field"><label for="recipientCapacity">Capacity (kg)</label><input id="recipientCapacity" type="number" min="0" value="100" /></div>
      <button class="btn btn--primary" type="submit" style="grid-column:1 / -1;">Save recipient</button>
    </form>
  </div>
  <div id="surplusList"></div>
</main>

<script src="../js/data/storage.js"></script>
<script src="../js/utils/dateUtils.js"></script>
<script src="../js/data/holidayData.js"></script>
<script src="../js/data/seedData.js"></script>
<script src="../js/core/safety.js"></script>
<script src="../js/core/matching.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/utils/notify.js"></script>
<script src="../js/pages/surplus.js"></script>
</body>
</html>
