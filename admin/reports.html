<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports — SmartServe</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="icon" href="../assets/smartserve-mark.svg" type="image/svg+xml" />
</head>
<body>

<header class="topbar">
  <a class="brand-lockup brand-lockup--light" href="../index.html"><img src="../assets/smartserve-mark.svg" alt="" /> <span>SmartServe · Admin</span></a>
  <div class="topbar__actions">
    <span class="topbar__meta">Signed in as <strong id="adminName">—</strong></span>
    <button class="btn btn--ghost btn--sm" id="logoutBtn">Sign out</button>
  </div>
</header>
<nav class="admin-nav">
  <a href="dashboard.html">Overview</a>
  <a href="inventory.html">Inventory</a>
  <a href="surplus.html">Surplus &amp; Matching</a>
  <a href="reports.html" class="is-active">Reports</a>
</nav>

<main class="page">
  <h1 style="font-size:1.3rem;">Food, cost &amp; carbon savings</h1>
  <p style="color:var(--steel-600);margin-bottom:20px;">Cumulative totals from confirmed donations, plus the kitchen's waste trend.</p>

  <div class="report-stats" id="reportStats"></div>

  <div class="grid grid-2">
    <div class="card">
      <span class="card__eyebrow">Waste, last 7 days</span>
      <div id="wasteChart"></div>
    </div>
    <div class="card">
      <span class="card__eyebrow">Donation log</span>
      <table class="data-table">
        <thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Shelter(s)</th></tr></thead>
        <tbody id="donationLog"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../js/data/storage.js"></script>
<script src="../js/utils/dateUtils.js"></script>
<script src="../js/data/holidayData.js"></script>
<script src="../js/data/seedData.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/utils/notify.js"></script>
<script src="../js/pages/reports.js"></script>
</body>
</html>
